# Upload ceiling: one file may not exceed 100 MB (the request-size limit
# sits above it to leave room for the multipart encoding overhead and the
# ?path= query). Larger uploads are refused by the servlet stack (413)
# before the write seam runs, so a too-big file can never land partially
# inside the Root. Properties, not code: an operator tuning a deployment
# changes config, not a build.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
